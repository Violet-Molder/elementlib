plugins {
    id 'java-library'
    // 版本在 settings.gradle 的 pluginManagement 里统一声明，这里不带 version。
    id 'net.neoforged.moddev'
    id 'idea'
    id 'maven-publish'
    id 'signing'
}

def lib_mod_id = mod_id
def lib_mod_name = mod_name
def lib_mod_license = mod_license
def lib_mod_version = mod_version
def lib_group_id = mod_group_id

version = lib_mod_version
group = lib_group_id

// 方案 B：artifact 按 MC 版本拆分，26.2 与 1.21.1 各自独立，互不冲突。
// 切换到 1.21.1 分支时改 gradle.properties 的 minecraft_version 即可自动跟随。
def lib_artifact_id = "${mod_id}-neoforge-${minecraft_version}"

base {
    archivesName = lib_artifact_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // LDLib2（唯一外部前置：StatusContainer 的多态序列化用它的 PersistedParser）
    maven { url = "https://maven.firstdark.dev/snapshots" }
}

dependencies {
    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}")
    // 1.18.48：原生支持 JDK 25-27，规避老版本在 JDK 25 上借 Unsafe::objectFieldOffset 导致的弃用告警
    compileOnly "org.projectlombok:lombok:1.18.48"
    annotationProcessor "org.projectlombok:lombok:1.18.48"
}

neoForge {
    version = project.neo_version

    // 独立运行配置：gradlew runClient 只加载 elementlib，可单独进游戏测反应。
    runs {
        client {
            client()
            jvmArgument('-Dstdout.encoding=UTF-8\n' +
                    '-Dstderr.encoding=UTF-8\n' +
                    '-XX:+AllowEnhancedClassRedefinition')
            systemProperty 'neoforge.modLoadingWarningScreen.skip', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', lib_mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', lib_mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${lib_mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 把 templates/META-INF/neoforge.mods.toml 展开成最终的 mod 元数据
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    // 模板是 UTF-8 编码，Windows 默认字符集是本地（GBK），必须显式指定，否则中文 description 会乱码。
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : lib_mod_id,
            mod_name               : lib_mod_name,
            mod_license            : lib_mod_license,
            mod_version            : lib_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 告警源自 toolchain(JBR25) 跑 Lombok 注解处理时用的 Unsafe；给它 direct 一个 allow 关闭 JDK24+ 的告警。
    // 只能放这里、不能放 gradle.properties 的 jvmargs：后者影响启动 daemon 的 JVM（可能是 JDK21），不认这个 JDK24+ 选项。
    options.fork = true
    options.forkOptions.jvmArgs.add('--sun-misc-unsafe-memory-access=allow')
}

// 发布到 Maven Central 需要 javadoc jar；doclint 的“缺少 @param/@return”会让构建失败，这里关掉它。
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = lib_artifact_id
            version = lib_mod_version
            from components.java
            pom {
                name = lib_mod_name
                description = '元素体系独立库：元素注册、元素附着、元素反应、元素衰减（仅元素附着量序列）、计时计数器、环境元素附着。'
                url = 'https://github.com/Violet-Molder/elementlib'
                licenses {
                    license {
                        name = 'NC-Open 1.0 (Non-Commercial Open)'
                        url = 'https://github.com/Violet-Molder/elementlib'
                    }
                }
                developers {
                    developer {
                        id = 'linweiyun'
                        name = 'Linweiyun'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Violet-Molder/elementlib.git'
                    developerConnection = 'scm:git:ssh://github.com/Violet-Molder/elementlib.git'
                    url = 'https://github.com/Violet-Molder/elementlib'
                }
            }
        }
    }
    repositories {
        maven {
            // Central Portal 的新账号用 OSSRH-staging 兼容端点（旧 s01.oss.sonatype.org 只给老 OSSRH 账号）
            name = 'CentralStaging'
            url = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            credentials {
                username = System.getenv('CENTRAL_USER') ?: ''
                password = System.getenv('CENTRAL_PASSWORD') ?: ''
            }
        }
    }
}

signing {
    def keyFile = file(System.getenv('GPG_PRIVATE_KEY_FILE') ?: 'G:\\el_key.asc')
    def secretKey = keyFile.exists() ? keyFile.text : ''
    def password = System.getenv('GPG_PASSWORD') ?: ''
    if (secretKey && password) {
        useInMemoryPgpKeys(secretKey, password)
        sign publishing.publications.mavenJava
    }
}
