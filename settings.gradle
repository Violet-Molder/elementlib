pluginManagement {
    repositories {
        gradlePluginPortal()
    }
    plugins {
        // 版本只在 pluginManagement 里声明一次；build.gradle 的 plugins 块里不带 version。
        id 'net.neoforged.moddev' version '2.0.147'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// elementlib 已是独立根工程，不再作为任何父工程的子模块，因此没有 include。
rootProject.name = 'elementlib'