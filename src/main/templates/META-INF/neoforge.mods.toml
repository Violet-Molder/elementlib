license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Linweiyun"
description='''
ElementLib —— 元素体系独立库：元素注册、元素附着、元素反应、元素衰减（仅元素附着量序列）、计时计数器、环境元素附着。
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ldlib2"
    type="required"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
